services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Використовуємо TCP 127.0.0.1, щоб не впиратися у сокети
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wp-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: ${PMA_HOST:-db}
      PMA_USER: ${PMA_USER:-root}
      PMA_PASSWORD: ${PMA_PASSWORD:-${DB_ROOT_PASSWORD}}
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-128M}
      PMA_ARBITRARY: ${PMA_ARBITRARY:-0}
    ports:
      - "${PMA_PORT:-8081}:80"

  php:
    build:
      context: ./php
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      MAX_EXEC_TIME: ${MAX_EXEC_TIME:-300}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
    volumes:
      - ./wp:/var/www/html
      - ./php/php-dev.ini:/usr/local/etc/php/conf.d/php-dev.ini
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Перевіряємо, що php-fpm слухає сокет/порт
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./wp:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    # entrypoint "wp" дозволяє робити: docker compose run --rm wpcli <cmd>
    entrypoint: wp
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_HOST: ${DB_HOST:-db}
      # Дублюємо, хоча Makefile вже передає через -e; не зашкодить
      WP_CLI_PHP_ARGS: "-d memory_limit=${PHP_MEMORY_LIMIT:-512M} -d max_execution_time=${MAX_EXEC_TIME:-300}"
    volumes:
      - ./wp:/var/www/html
      # Якщо додаси ./wp/wp-cli.yml — wpcli сам підхопить
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: wp-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"  # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP server
    environment:
      # Правильна схема авторизації для UI:
      MP_UI_AUTH: "${MAILPIT_USER}:${MAILPIT_PASS}"
      MP_UI_USER: "${MAILPIT_USER}"   # admin з .env
      MP_UI_PASS: "${MAILPIT_PASS}"   # secret123 з .env
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
    # За потреби можна додати персистент для листів:
    # volumes:
    #   - mailpit_data:/data

volumes:
  db_data:
  # mailpit_data:
