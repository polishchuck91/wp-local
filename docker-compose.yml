services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wp-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: ${PMA_HOST:-db}
      PMA_USER: ${PMA_USER:-root}
      PMA_PASSWORD: ${PMA_PASSWORD:-${DB_ROOT_PASSWORD}}
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-128M}
      PMA_ARBITRARY: ${PMA_ARBITRARY:-0}
    ports:
      - "${PMA_PORT:-8081}:80"
    restart: unless-stopped

  php:
    build:
      context: ./php            # поклади Dockerfile у ./php/Dockerfile
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      MAX_EXEC_TIME: ${MAX_EXEC_TIME:-300}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
      XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
    volumes:
      - ./wp:/var/www/html
      # якщо у Dockerfile вже є zz-dev.ini / zz-xdebug.ini, цей файл можна забрати:
      - ./php/php-dev.ini:/usr/local/etc/php/conf.d/php-dev.ini
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./wp:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped

  wpcli:
    image: wordpress:cli-php8.3
    entrypoint: wp
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_HOST: ${DB_HOST:-db}
      WP_CLI_PHP_ARGS: "-d memory_limit=${PHP_MEMORY_LIMIT:-512M} -d max_execution_time=${MAX_EXEC_TIME:-300}"
    volumes:
      - ./wp:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      php:
        condition: service_started
    # restart не потрібен для one-shot
    # restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: wp-mailpit
    environment:
      # один правильний спосіб авторизації:
      MP_UI_AUTH: "${MAILPIT_USER}:${MAILPIT_PASS}"
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    # volumes:
    #   - mailpit_data:/data
    restart: unless-stopped

  composer:
    image: composer:2
    container_name: wp-composer
    working_dir: /var/www/html
    depends_on:
      - php
    volumes:
      - ./wp:/var/www/html
      - composer-cache:/tmp/composer
    entrypoint: ["composer"]

volumes:
  db_data:
  composer-cache:
  # mailpit_data:
