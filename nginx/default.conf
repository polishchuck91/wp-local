server {
  listen 80;
  server_name wp.local;

  # Має збігатися з volume у docker-compose
  root /var/www/html;
  index index.php index.html;

  # ↑ Зручно для великих медіа/імпорту
  client_max_body_size 64m;

  # Базові security-headers (за потреби розширюй)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-XSS-Protection "1; mode=block";

  # Головний роутинг WordPress
  location / {
    try_files $uri $uri/ /index.php?$is_args$args;
  }

  # Кешування статики (immutable для fingerprinted ассетів)
  location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|webp|ico|woff2?|ttf|eot|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
    access_log off;
  }

  # PHP-FPM (WordPress, wp-admin, admin-ajax.php тощо)
  location ~ \.php$ {
    # 1) якщо файлу немає — 404 (захист від довільних php-псевдошляхів)
    try_files $uri =404;

    # 2) коректна підтримка PATH_INFO (рідко потрібно, але корисно)
    fastcgi_split_path_info ^(.+\.php)(/.+)$;

    # 3) параметри FastCGI (краще fastcgi.conf, ніж fastcgi_params)
    include fastcgi.conf;

    # 4) ВАЖЛИВО: справжній шлях до скрипту (без симлінків)
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;
    fastcgi_index index.php;

    # 5) PHP-FPM сервіс із docker-compose
    fastcgi_pass php:9000;

    # 6) Таймаути/буфери (трохи щедріше для повільного локалу)
    fastcgi_read_timeout 180;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
  }

  # Блокування доступу до прихованих/чутливих файлів
  location ~ /\. { deny all; }
  location ~* /(composer\.(json|lock)|package(-lock)?\.json|webpack\.(config|stats)\.js)$ { deny all; }
  location ~* /(\.git|\.env|wp-config\.php|readme\.html)$ { deny all; }

  # Проста перевірка доступності (можеш використовувати як healthcheck HTTP)
  location = /ping {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
