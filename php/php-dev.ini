; ------------------------------------------------------------
; PHP Development Settings
; ------------------------------------------------------------
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${MAX_EXEC_TIME}
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = Europe/Kyiv

; ------------------------------------------------------------
; Xdebug 3 configuration
; ------------------------------------------------------------
zend_extension = xdebug

; Режими: off / debug / develop / trace / coverage
xdebug.mode = ${XDEBUG_MODE}

; 1 — автоматично визначає IP клієнта (зручно на Linux)
; 0 — якщо хочеш явно задавати host.docker.internal
xdebug.discover_client_host = 1

; Використовується як fallback (macOS / Windows)
xdebug.client_host = ${XDEBUG_CLIENT_HOST}
xdebug.client_port = ${XDEBUG_CLIENT_PORT}

; yes — старт дебагера при кожному запиті
xdebug.start_with_request = yes

; Без зайвих логів (можна поставити 7 для детальної відладки)
xdebug.log_level = 0
